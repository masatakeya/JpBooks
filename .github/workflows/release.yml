name: Release

# main で manifest.json のバージョンを上げると、そのバージョンのタグとGitHubリリースを作成する。
# BRATはこのリリースに添付された main.js / manifest.json / styles.css を取得する。
# 同じバージョンのリリースが既にあれば何もしない。
on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: manifest.jsonのバージョンを取得
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "リリース $version は作成済みのためスキップします"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ビルド
        if: steps.version.outputs.exists != 'true'
        run: |
          npm ci
          npm run build

      - name: リリースを作成
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            main.js manifest.json styles.css
